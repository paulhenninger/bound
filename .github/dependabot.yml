version: 2

# Security updates only (except Docker images, at the end, where there are any): open-pull-requests-limit 0
# turns off the weekly version-update PRs (and the CI minutes each one costs); Dependabot still
# raises a PR for a vulnerable dependency, using the groups and ignores below.
updates:

  - package-ecosystem: npm
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # CI workflow actions
  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
